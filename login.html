<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

</head>
<body>
    <div class="formulario">
        <div class="login-form">
            <h2>Login</h2>
            <form action="/login" method="POST">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Entrar</button>
            </form>  
            <!-- Botão para ir à página de cadastro -->
            <button onclick="window.location.href='register.html'">Cadastrar-se</button>
        </div>
    </div>
</body>
<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background-image: url('img/ti.gif'); /*imagem de fundo */
        background-size: cover;
        background-position: center;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* contêiner principal */
    .formulario {
        max-width: 400px;
        width: 100%;
        background: rgba(255, 255, 255, 0.8); 
        padding: 40px;
        border-radius: 20px;
        position: relative;
        margin: auto;
    }

    /* formulário */
    .formulario .login-form {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    h2 {
        text-align: center;
        margin-top: 30px;
    }

    label, .links, button {
        margin-top: 20px;
    }

    label {
        font-size: 12px;
        color: rgb(77, 77, 77);
        font-weight: 600;
    }

    input {
        padding: 8px;
        outline: none;
        border: 0;
        background: #EEE;
        width: 100%;
        margin-bottom: 20px;
    }

    /* botão de submit */
    button {
        background: linear-gradient(to right, #9d50bb, #6e48aa);
        padding: 8px;
        border: 0;
        color: #fff;
        font-size: 15px;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        width: 100%;
        transition: all 0.3s ease;
    }

    button:hover {
        background: linear-gradient(to right, #6e48aa, #9d50bb); 
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); 
        transform: translateY(-2px); 
    }
</style>
</html>
